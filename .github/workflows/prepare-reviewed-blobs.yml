# Temporary editing transport for this PR; removed by the production commit.
# Creates content-addressed Git blobs only. Never writes a branch or tag ref.
name: Prepare reviewed source blobs
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/rime-interaction-and-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply and verify reviewed patches
        run: |
          set -eu
          test "$(git hash-object lua/tiger_sentence.lua)" = b6ac5c1ef15abb80c66fa3028ce8e84d83c6377f
          git apply .review-interaction.patch
          test "$(git hash-object lua/tiger_sentence.lua)" = c39c64d379798027d647caca454aa258235d5470
          cp lua/tiger_sentence.lua /tmp/reviewed-interaction.lua
          git apply .review-confidence.patch
          test "$(git hash-object lua/tiger_sentence.lua)" = 169c0776506961601f4197e7f74c9e1896fee69f
          git apply .review-tests.patch
          test "$(git hash-object tools/test_tiger_sentence_incremental.lua)" = f18cc87f7f49c9cac881bcc6d8491ee9ed660f4e
      - name: Create verified blobs without moving any refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          for path, expected in [('/tmp/reviewed-interaction.lua', 'c39c64d379798027d647caca454aa258235d5470'), ('lua/tiger_sentence.lua', '169c0776506961601f4197e7f74c9e1896fee69f'), ('tools/test_tiger_sentence_incremental.lua', 'f18cc87f7f49c9cac881bcc6d8491ee9ed660f4e')]:
              data = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == expected
              request = urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+'/git/blobs', data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print(json.dumps({'path':path,'blob_sha':result['sha'],'bytes':len(data)}))
          PY
